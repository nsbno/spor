# A task without an entry waits for the same task in its workspace dependencies.
tasks:
  # outputs makes build cacheable in `pnpm pipeline` (not in `pnpm run`). An unchanged
  # package restores its outputs from the cache instead of building.
  build:
    dependsOn:
      - ^build
    outputs:
      - "{dist,react-native}/**"
  # In dev, designmanual-frontend reads spor-react and spor-loader from source
  # ("@vygruppen/source" export condition), so they need no watcher.
  # dev scripts never exit, so they wait for builds, not each other.
  # The root dev script raises --workspace-concurrency to give each one a slot.
  dev:
    dependsOn:
      - ^build
  lint:
    dependsOn: []

# Root `pnpm dev`. --full runs every project, not only those changed since origin/main.
pipelines:
  dev:
    - dev
