name: "Deploy Design Studio 🎨"

on:
  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: deploy-design-studio
  cancel-in-progress: false

jobs:
  deploy-studio:
    name: Deploy Sanity Design Studio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter "@vygruppen/designmanual^..." build

      - name: Deploy Studio
        run: pnpm --filter @vygruppen/designmanual run deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
