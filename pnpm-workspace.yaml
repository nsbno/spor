packages:
  - "packages/**"
  - "apps/storybook"
  - "apps/design-studio"
  - "apps/designmanual-frontend"

minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeExclude:
  # First Chakra whose @zag-js/toast handles the "critical" toast type.
  # Passes the age check on 2026-11-10. Remove then.
  - "@chakra-ui/react@3.38.0"

preferFrozenLockfile: true
# Without this, the react-native-svg peer of spor-icon-react-native pulls in all of react-native.
autoInstallPeers: false
peerDependencyRules:
  ignoreMissing:
    # Needed by @sanity/workflow-cli, not shipped by @sanity/cli. We don't use workflow commands.
    - "@sanity/workflow-blueprint"
savePrefix: ""
trustPolicy: no-downgrade
trustPolicyExcludePrune: true

# New install scripts fail the install until allowed or denied here.
strictDepBuilds: true
allowBuilds:
  "@bundled-es-modules/glob": false
  esbuild: false
  style-dictionary: false

# Versions are exact, including those spor-react publishes as dependencies.
# Sanity packages are bumped together, except:
#   @sanity/vision stays at 6.19.0 (6.20+ fails trustPolicy).
#   @sanity/eslint-config-studio stays at 6.x until eslint is on 10.
# One React and one Vite version across the workspace (a second React duplicates Chakra and Emotion).
# @types/node follows the Node major in root engines.
# TypeScript 7 has no JS API until 7.1, so tools importing "typescript" get 6.x
# while the `tsc` binary comes from TypeScript 7 via @typescript/native.
# https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
