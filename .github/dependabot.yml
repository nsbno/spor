version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    # 0 disables version updates; security updates are unaffected
    open-pull-requests-limit: 0
    # Reviewers are assigned via .github/CODEOWNERS (`reviewers` is no longer supported here)
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      security-minor-and-patch:
        applies-to: security-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-security-minor-and-patch:
        applies-to: security-updates
        update-types:
          - minor
          - patch
