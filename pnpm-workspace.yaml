packages:
  - "packages/**"
  - "apps/storybook"
  - "apps/design-studio"
  - "apps/designmanual-frontend"

minimumReleaseAge: 10080 # ensures that only packages released at least 7 days ago can be installed
minimumReleaseAgeExclude:

  # 3.38.0 is the first Chakra whose @zag-js/toast doesn't crash on the "critical" toast type.
  # It is 7 days old on 2026-11-10. Remove this entry then.
  - "@chakra-ui/react@3.38.0"
  # Pinned by @chakra-ui/react 3.38.0. It is 7 days old on 2026-11-05. Remove this entry then.
  - "@ark-ui/react@5.40.0"

preferFrozenLockfile: true
savePrefix: ""
trustPolicy: no-downgrade
# Lockfile entries whose trust level dropped compared to an earlier release.
# They were in the lockfile before pnpm enforced trustPolicy (pnpm 10.4.1 ignored it).
# Some of these came from the retired apps/studio and others come from Storybook;
# the prune setting removes an entry here once the lockfile no longer has that version.
trustPolicyExclude:
  - chokidar@4.0.3
  - groq@3.88.1-typegen-experimental.0
  - reselect@5.1.1
  - semver@5.7.2 || 6.3.1
trustPolicyExcludePrune: true

# Dependency install scripts are blocked. A new one fails the install until someone sets it to true or false here.
strictDepBuilds: true
allowBuilds:
  "@bundled-es-modules/glob": false
  canvas: false
  esbuild: false
  style-dictionary: false

# Versions are exact, including those spor-react publishes as dependencies.
# One React and one Vite version across the workspace (a second React duplicates Chakra and Emotion).
# @types/node follows the Node major in root engines.
# TypeScript 7 has no JS API until 7.1, so tools importing "typescript" get 5.x
# while the `tsc` binary comes from TypeScript 7 via @typescript/native.
# https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
catalog:
  "@chakra-ui/react": 3.38.0
  "@emotion/react": 11.14.0
  "@types/node": 26.6.6
  react: 19.2.9
  react-dom: 19.2.9
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  vite: 8.3.5
  "@typescript/native": npm:typescript@7.0.2
  typescript: 5.9.3
  "@babel/core": 7.29.7
  "@chakra-ui/cli": 3.34.0
  "@changesets/cli": 2.29.7
  "@emotion/cache": 11.14.0
  "@eslint/js": 9.39.1
  "@modelcontextprotocol/sdk": 1.29.0
  "@mux/mux-video-react": 0.27.2
  "@portabletext/react": 6.0.3
  "@portabletext/types": 4.0.2
  "@react-router/dev": 7.14.0
  "@react-router/fs-routes": 7.14.0
  "@react-router/node": 7.14.0
  "@react-router/serve": 7.14.0
  "@react-types/shared": 3.32.0
  "@rolldown/plugin-babel": 0.3.0
  "@sanity/client": 7.20.0
  "@sanity/code-input": 7.3.3
  "@sanity/eslint-config-studio": 6.0.0
  "@sanity/image-url": 2.1.1
  "@sanity/preview-url-secret": 4.1.5
  "@sanity/react-loader": 2.3.0
  "@sanity/table": 3.1.12
  "@sanity/ui": 3.3.5
  "@sanity/vision": 6.9.0
  "@sanity/visual-editing": 5.3.3
  "@storybook/addon-docs": 10.6.5
  "@storybook/react": 10.6.5
  "@storybook/react-vite": 10.6.5
  "@svgr/plugin-svgo": 8.1.0
  "@testing-library/jest-dom": 6.9.1
  "@testing-library/react": 16.3.2
  "@testing-library/user-event": 14.6.1
  "@types/jscodeshift": 0.11.11
  "@vitejs/plugin-react": 6.2.0
  babel-plugin-react-compiler: 1.0.0
  case: 1.6.3
  eslint: 9.39.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react: 7.37.5
