packages:
  - "packages/**"
  - "apps/storybook"
  - "apps/design-studio"
  - "apps/designmanual-frontend"

minimumReleaseAge: 10080 # ensures that only packages released at least 7 days ago can be installed
minimumReleaseAgeExclude:
  # Came in with the fast-xml-parser 5.11.2 pin while pnpm 10.4.1 ignored minimumReleaseAge.
  # It is 7 days old on 2026-10-17. Remove this entry then.
  - strnum@2.5.1
  # 3.38.0 is the first Chakra whose @zag-js/toast doesn't crash on the "critical" toast type.
  # It is 7 days old on 2026-11-10. Remove this entry then.
  - "@chakra-ui/react@3.38.0"
  # Pinned by @chakra-ui/react 3.38.0. It is 7 days old on 2026-11-05. Remove this entry then.
  - "@ark-ui/react@5.40.0"

preferFrozenLockfile: true
savePrefix: ""
trustPolicy: no-downgrade
# Lockfile entries whose trust level dropped compared to an earlier release.
# They were in the lockfile before pnpm enforced trustPolicy (pnpm 10.4.1 ignored it).
# Some of these came from the retired apps/studio and others come from Storybook;
# the prune setting removes an entry here once the lockfile no longer has that version.
trustPolicyExclude:
  - chokidar@4.0.3
  - groq@3.88.1-typegen-experimental.0
  - reselect@5.1.1
  - semver@5.7.2 || 6.3.1
  - undici-types@6.21.0
trustPolicyExcludePrune: true

# Dependency install scripts are blocked. A new one fails the install until someone sets it to true or false here.
strictDepBuilds: true
allowBuilds:
  "@bundled-es-modules/glob": false
  canvas: false
  esbuild: false
  style-dictionary: false

# One React version across the workspace. A second copy duplicates Chakra and Emotion
# for linked packages like spor-react.
# @types/node follows the Node major in the root package.json engines.
# One Vite version for the apps that build with it.
catalog:
  "@types/node": 22.20.5
  react: 19.2.9
  react-dom: 19.2.9
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  vite: 8.3.5

overrides:
  fast-xml-parser: 5.11.2
